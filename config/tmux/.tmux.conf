# ── dotfiles .tmux.conf ────────────────────────────────────────
# Symlinked via install.sh

# Set $TERM for 256-color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Use Ctrl-a instead of Ctrl-b (easier on QWERTY)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support
set -g mouse on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer
set -g history-limit 50000

# Vi-style navigation in copy mode
setw -g mode-keys vi

# Split panes with | and - (like vim)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config with Ctrl-a r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Quick pane navigation (Alt + arrow)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Resize panes with Shift + arrow (hold for repeat)
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Status bar styling
set -g status-bg colour235
set -g status-fg colour252
set -g status-interval 5
set -g status-left '#[fg=green]#S '
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M '
