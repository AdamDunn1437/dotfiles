# ── dotfiles starship.toml ────────────────────────────────────
# Symlinked to ~/.config/starship.toml via install.sh

# Minimal preset — shows nix-shell indicator when inside `nix develop`

format = """
[](#9A348E)\
$os\
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$nix_shell\
$nodejs\
$rust\
$python\
[](fg:#86BBD8 bg:#06969A)\
$cmd_duration\
[](fg:#06969A)\
$line_break\
$character\
"""

add_newline = false

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
truncation_length = 3

[git_branch]
format = "[$branch]($style)"
style = "bold purple"

[git_status]
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[nix_shell]
format = "via [$symbol$name( \\($state\\))]($style) "
symbol = "❄ "
style = "bold blue"

[cmd_duration]
format = "⏱ [$duration]($style)"
style = "bold yellow"
